name: release

# Pushing a tag vX.Y.Z publishes that version: every CI gate runs against the
# tagged commit first, then the archive is built from it, installed once with the
# consumer verifier, and attached to a new release together with its SHA-256 and
# the lock a consumer pins. A version is published once; an existing release is
# never replaced.
#
# Every pull request runs Prepare as a dry run, for the version in package.json,
# so it can be a required check. On a pull request the gates are not repeated
# here (ci.yml already runs them for it) and nothing is published.

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare
    needs: gates
    # Runs after the gates passed on a tag, and without them on a pull request.
    # Anything else (gates failed or cancelled, another event) skips it, and a
    # skipped Prepare leaves Publish skipped.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.gates.result == 'success') ||
        (github.event_name == 'pull_request' && needs.gates.result == 'skipped')
      )
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Fail on purpose
        run: exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The tag names the package version and a commit on main
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$PUBLISH" = true ]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || { echo "::error::tag $tag does not match package version $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$tag is not on main"; exit 1; }
          else
            tag="v$version"
            echo "::notice::dry run for $tag; the commit is not required to be on main yet"
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: The version has not been published
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PUBLISH" != true ]; then
              echo "::notice::$TAG is already published; the next release needs a new version"
              exit 0
            fi
            echo "::error::release $TAG already exists; a published version is never replaced"
            exit 1
          fi
      - name: Build and verify the archive
        run: |
          node tools/pack.js --out "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release-notes.md"
          lock="$RUNNER_TEMP/dist/core.lock.json"
          api="$(node -p 'require("./package.json").haAgentCore.adapterApi')"
          node tools/verify-core.js install --lock "$lock" --adapter-api "$api" \
            --archive "$(ls "$RUNNER_TEMP"/dist/*.tar)" --dest "$RUNNER_TEMP/installed"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: What would be published
        if: env.PUBLISH != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "dry run: release $TAG would carry:"
          ls -l "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/core.lock.json"

  publish:
    name: Publish
    needs: [gates, prepare]
    # No status function here, so both must have succeeded.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Publish the release
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file release-notes.md dist/*.tar dist/*.tar.sha256 dist/core.lock.json
