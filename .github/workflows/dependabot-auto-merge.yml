name: Dependabot auto-merge

# Automatically merges Dependabot pull requests for non-major updates once all
# required status checks pass. Major version bumps are left for manual review.
#
# Safe use of pull_request_target: this job never checks out or executes the
# PR's code — it only reads Dependabot's metadata and the pull request's CI
# verdict on install code (a JSON file), and enables auto-merge, which then waits
# for the branch-protection required checks before merging.
#
# An update that changes the code an allowed install script runs is not merged:
# the pull request is labelled "needs review" and waits for the install code to
# be reviewed and recorded. A verdict that cannot be read counts as a change.
#
# A merge made with the workflow token raises no push event, so once the pull
# request has merged this job starts the main-measured workflow, which runs CI
# for the head of main unless it already has a run. That workflow also has a
# schedule, but GitHub does not guarantee scheduled runs, so this dispatch is
# what measures a bot merge.

on: pull_request_target

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Pinned to an immutable commit SHA (this job runs with write scope in a
        # pull_request_target context). The version comment lets Dependabot's
        # github-actions updater keep the pin current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Read the install-code verdict of this pull request's CI
        id: verdict
        # Fail-closed allowlist: only explicitly-recognized minor/patch updates
        # auto-merge. Majors — and any PR whose update-type can't be determined —
        # fall through to manual review instead of merging by default.
        if: ${{ contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) }}
        run: |
          reviewed=false
          run_id=""
          for _ in $(seq 1 60); do
            run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | select(.) | "\(.id) \(.status)"')" || run=""
            if [ "${run#* }" = completed ]; then run_id="${run%% *}"; break; fi
            sleep 30
          done
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$REPO" -n install-scripts-verdict -D "$RUNNER_TEMP/verdict"; then
            if jq -e '.reviewed == true' "$RUNNER_TEMP/verdict/install-scripts-verdict.json" >/dev/null; then
              reviewed=true
            fi
          fi
          if [ "$reviewed" = true ]; then
            gh pr edit "$PR_URL" --remove-label "needs review" >/dev/null 2>&1 || true
          else
            gh pr edit "$PR_URL" --add-label "needs review"
            echo "::notice::the install code changed, or its verdict could not be read; not merging this update"
          fi
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        id: enable
        if: ${{ steps.verdict.outputs.reviewed == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure main once the pull request has merged
        if: ${{ steps.enable.conclusion == 'success' }}
        run: |
          answered=0
          for _ in $(seq 1 80); do
            # A failed call counts as "not merged yet"; the next poll retries it.
            state="$(gh pr view "$PR_URL" --json state --jq .state)" || state=""
            [ -n "$state" ] && answered=1
            case "$state" in
              MERGED)
                gh workflow run main-measured.yml --repo "$REPO" --ref main
                echo "::notice::merged; main-measured dispatched"
                exit 0 ;;
              CLOSED)
                echo "closed without a merge"
                exit 0 ;;
            esac
            sleep 30
          done
          if [ "$answered" = 0 ]; then
            echo "::error::the pull request state could not be read"
            exit 1
          fi
          echo "::warning::not merged within 40 minutes; main is not measured for this merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
