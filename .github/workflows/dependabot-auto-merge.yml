name: Dependabot auto-merge

# Merges a Dependabot pull request for a non-major update once all required
# checks pass, but only when the install code it would bring is the reviewed one.
#
# Safe use of pull_request_target: the job checks out the BASE branch only and
# runs the base branch's tools/check-install-scripts.js with the base branch's
# install-scripts.json records. From the pull request it reads nothing but the
# manifests and lockfiles, fetched as data through the API; none of its code is
# checked out or run.
#
# Every new head is judged again (a newer run cancels an older one). Auto-merge is
# enabled for that exact head commit only; for anything else — a major update, a
# changed or unknown install-code verdict, an error — auto-merge is turned off
# and the pull request is labelled "needs review".
#
# A merge made with the workflow token raises no push event, so once the pull
# request has merged this job starts the main-measured workflow, which runs CI
# for the head of main unless it already has a run. That workflow also has a
# schedule, but GitHub does not guarantee scheduled runs, so this dispatch is
# what measures a bot merge.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Pinned to an immutable commit SHA (this job runs with write scope in a
        # pull_request_target context). The version comment lets Dependabot's
        # github-actions updater keep the pin current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Decide on this head
        id: decide
        run: |
          set -uo pipefail
          decision=hold
          # Fail-closed allowlist: only explicitly-recognized minor/patch updates
          # auto-merge. Majors — and any PR whose update-type can't be determined —
          # fall through to manual review instead of merging by default.
          case "$UPDATE_TYPE" in
            version-update:semver-minor|version-update:semver-patch) allowlisted=true ;;
            *) allowlisted=false ;;
          esac
          reviewed=true
          for dir in . app ha-tools; do
            mkdir -p "$RUNNER_TEMP/head/$dir"
            for file in package.json package-lock.json; do
              # The pull request's file at this exact head, as data.
              repo_path="${dir#.}"
              repo_path="${repo_path:+$repo_path/}$file"
              if ! gh api -H "Accept: application/vnd.github.raw+json" \
                  "repos/$REPO/contents/$repo_path?ref=$HEAD_SHA" > "$RUNNER_TEMP/head/$dir/$file"; then
                echo "::warning::cannot read $dir/$file at $HEAD_SHA"
                reviewed=false
              fi
            done
            if ! node tools/check-install-scripts.js --package "$RUNNER_TEMP/head/$dir/package.json" \
                --lock "$RUNNER_TEMP/head/$dir/package-lock.json" --record "$dir/install-scripts.json"; then
              reviewed=false
            fi
          done
          if [ "$allowlisted" = true ] && [ "$reviewed" = true ]; then
            decision=merge
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for this head, or turn it off
        id: apply
        if: ${{ always() && steps.metadata.conclusion == 'success' }}
        run: |
          set -uo pipefail
          if [ "$DECISION" = merge ]; then
            gh pr edit "$PR_URL" --remove-label "needs review" >/dev/null 2>&1 || true
            gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          # Turning auto-merge off must succeed, or it must already be off.
          if ! gh pr merge --disable-auto "$PR_URL"; then
            armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$armed" != false ]; then
              echo "::error::auto-merge could not be turned off"
              exit 1
            fi
          fi
          if [ "$REVIEWED" != true ]; then
            gh pr edit "$PR_URL" --add-label "needs review"
            echo "::notice::the install code of this update is not the reviewed one; it waits for a review"
          fi
        env:
          DECISION: ${{ steps.decide.outputs.decision }}
          REVIEWED: ${{ steps.decide.outputs.reviewed }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure main once the pull request has merged
        if: ${{ steps.apply.outputs.enabled == 'true' }}
        run: |
          answered=0
          for _ in $(seq 1 80); do
            # A failed call counts as "not merged yet"; the next poll retries it.
            state="$(gh pr view "$PR_URL" --json state --jq .state)" || state=""
            [ -n "$state" ] && answered=1
            case "$state" in
              MERGED)
                gh workflow run main-measured.yml --repo "$REPO" --ref main
                echo "::notice::merged; main-measured dispatched"
                exit 0 ;;
              CLOSED)
                echo "closed without a merge"
                exit 0 ;;
            esac
            sleep 30
          done
          if [ "$answered" = 0 ]; then
            echo "::error::the pull request state could not be read"
            exit 1
          fi
          echo "::warning::not merged within 40 minutes; main is not measured for this merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
