# Dependabot configuration.
#
# Groups intentionally omit `update-types`: with patterns:["*"], adding an
# update-types filter silently suppresses major-version PRs. Majors therefore
# group in with minor/patch, and the dependabot-auto-merge workflow's fail-closed
# guard holds any group PR containing a major for manual review; minor/patch-only
# groups auto-merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # Root tooling, the add-on core's runtime dependencies (/app: console + prompt
  # server) and the screenshot helper (/ha-tools, its own manifest and lockfile).
  # group-by: dependency-name makes one bump of a dependency ONE pull request
  # across all three manifests instead of one per directory.
  - package-ecosystem: npm
    directories: ["/", "/app", "/ha-tools"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      npm:
        patterns: ["*"]
        group-by: dependency-name

  # The add-on base image the start script is tested in.
  - package-ecosystem: docker
    directory: "/app/test/image"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
