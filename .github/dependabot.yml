# Dependabot configuration.
#
# Groups intentionally omit `update-types`: with patterns:["*"], adding an
# update-types filter silently suppresses major-version PRs. Majors therefore
# group in with minor/patch, and the dependabot-auto-merge workflow's fail-closed
# guard holds any group PR containing a major for manual review; minor/patch-only
# groups auto-merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      npm:
        patterns: ["*"]

  # The add-on core's runtime dependencies (console + prompt server).
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      npm-app:
        patterns: ["*"]

  # The screenshot helper, a separate manifest and lockfile.
  - package-ecosystem: npm
    directory: "/ha-tools"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      npm-ha-tools:
        patterns: ["*"]
